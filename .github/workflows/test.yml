name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.1", "1.27.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify
          (cd testdata && go mod download && go mod verify)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 1x ./...

      - name: Enforce 90 percent coverage
        if: matrix.go == '1.27.1'
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 90) exit 1 }'

      - name: Upload coverage (best effort)
        if: matrix.go == '1.27.1'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          file: ./coverage.out
          fail_ci_if_error: false
          use_oidc: true

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.1"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Staticcheck v0.8.1
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck v1.8.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  plugin-smoke:
    name: golangci-lint custom plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build and run custom golangci-lint v2.13.2
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          GOLANGCI_LINT_BIN="$(go env GOPATH)/bin/golangci-lint" ./scripts/verify-plugin.sh
